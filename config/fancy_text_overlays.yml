# 花式文本叠加配置文件
# Fancy Text Overlays Configuration

fancy_text:
  # 功能开关
  enable: true
  
  # 显示模式配置
  display_mode: "interval"  # interval: 间隔显示, continuous: 全程显示
  
  # 间隔显示模式配置
  interval_mode:
    frequency: 25  # 每25秒出现一次
    duration: 4    # 每次显示4秒
    fade_duration: 0.5  # 淡入淡出时间
    display_count: 1  # 同时显示的短语数量 (1-5)
  
  # 全程显示模式配置  
  continuous_mode:
    display_count: 3  # 固定显示3个短语
    fade_duration: 0  # 无淡入淡出效果
    position: "top_center_high"  # 固定使用中上方位置
  
  # 默认短语列表
  default_phrases:
    - "Deep Moisturizing Care"
    - "Natural Organic Formula"
    - "24 Hour Lasting Effect"
    - "Anti-Aging Collagen Boost"
    - "Professional Skincare Solution"
  
  # 统一短语样式配置
  phrase_style:
    font_file: "fonts/PingFang.ttc"
    font_size: 70
    font_color: "white"
    font_style: "bold"
    line_spacing: 50  # 多行短语间距
    position:
      x: "center"  # center, left, right, 或具体数值
      y: "center"  # center, 或距离顶部像素值
    shadow:
      enable: true
      color: "black"
      offset_x: 3
      offset_y: 3
      blur: 2
    background:
      enable: true
      color: "orange"
      padding: 15
      border_radius: 8
      opacity: 0.9
    outline:
      enable: true
      color: "gray"
      width: 1
    animation:
      type: "fade_in"  # fade_in, slide_left, slide_right, scale_in
      duration: 0.8
  
  # 位置预设（可选择的位置模板）
  position_presets:
    top_center:
      y: 120
      x: "center"
    top_center_high:
      y: 80
      x: "center"
    top_left:
      y: 120
      x: 80
    center:
      y: "center"
      x: "center"
    bottom_center:
      y: "height-200"
      x: "center"
  
  # 显示规则
  display_rules:
    # 位置随机化
    random_position: true
    position_weights:
      top_center: 40
      top_center_high: 20
      top_left: 20
      center: 15
      bottom_center: 5
    
    # 样式变化
    random_colors: false   # 是否随机颜色
    random_fonts: false    # 是否随机字体
  
  # 兼容性配置
  compatibility:
    # 不同分辨率的字体大小调整
    font_scaling:
      "1080x1920":  # 竖屏1080p
        font_size: 70
        line_spacing: 50
      "1280x720":   # 横屏720p
        font_size: 65
        line_spacing: 45
      "1080x1080":  # 方形1080p
        font_size: 70
        line_spacing: 50
    
    # Windows路径处理
    windows_font_path: true
    
    # 字体回退
    fallback_fonts:
      - "fonts/PingFang.ttc"
      - "fonts/Songti.ttc" 
      - "Arial"
      - "sans-serif"